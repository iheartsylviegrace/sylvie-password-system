<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Looking Glass • Astrocartography</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.28.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.28.0/mapbox-gl.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Helvetica,Arial,sans-serif;
}

main{
    width:min(700px,92%);
    margin:60px auto;
}

h1{
    font-size:42px;
    font-weight:300;
    margin-bottom:12px;
}

p{
    color:#999;
    margin-bottom:40px;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:14px;
    background:#111;
    border:1px solid #333;
    color:white;
    font-size:16px;
}

button{
    margin-top:30px;
    width:100%;
    padding:16px;
    background:white;
    color:black;
    border:none;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

#result{
    margin-top:30px;
    white-space:pre-wrap;
    color:#7cff7c;
}

#map{
    width:100%;
    height:700px;
    margin-top:40px;
    border-radius:18px;
    overflow:hidden;
}

</style>

</head>

<body>

<main>

<h1>Astrocartography</h1>

<p>If you can see this page, the astrocartography frontend is working.</p>

<label>Name</label>
<input id="name">

<label>Date of Birth</label>
<input id="date" type="date">

<label>Time of Birth</label>
<input id="time" type="time">

<label>Birth City</label>
<input id="city" placeholder="Chicago, IL">

<button id="generate">
Generate Chart
</button>

<div id="result"></div>

<div id="map"></div>

<script>

mapboxgl.accessToken =
"YOUR_PUBLIC_MAPBOX_TOKEN";

const map = new mapboxgl.Map({

    container:"map",

    style:"mapbox://styles/mapbox/satellite-streets-v12",

    projection:"globe",

    center:[0,20],

    zoom:1.5,

    pitch:25,

    antialias:true

});

map.addControl(new mapboxgl.NavigationControl());

map.on("style.load", () => {

    map.setFog({

        color:"rgb(186,210,235)",

        "high-color":"rgb(36,92,223)",

        "space-color":"rgb(5,5,15)",

        "star-intensity":0.8

    });

});

document.getElementById("generate").onclick = async function(){

    const result = document.getElementById("result");

    result.style.color = "#ffffff";
    result.textContent = "Generating chart...";

    const birthDate = document.getElementById("date").value.split("-");
    const birthTime = document.getElementById("time").value.split(":");

    try{

        const response = await fetch("/api/astrocartography",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                name:document.getElementById("name").value,

                day:Number(birthDate[2]),

                month:Number(birthDate[1]),

                year:Number(birthDate[0]),

                hour:Number(birthTime[0]),

                minute:Number(birthTime[1]),

                latitude:0,

                longitude:0,

                timezone:0,

                birthCity:document.getElementById("city").value

            })

        });

        const data = await response.json();

        console.log(data);

        result.style.color="#7cff7c";
        result.textContent=JSON.stringify(data,null,2);

    }catch(err){

        console.error(err);

        result.style.color="#ff7777";
        result.textContent=err.message;

    }

};

</script>

</main>

</body>
</html>
