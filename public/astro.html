<h1>The World &amp; You</h1>

<p class="subtitle">
    Astrocartography
</p>

<form id="birth-data-form">

    <label>Name</label>
    <input
        id="name"
        autocomplete="name"
    >

    <label>Date of Birth</label>
    <input
        id="date"
        type="date"
        required
    >

    <label>Time of Birth</label>
    <input
        id="time"
        type="time"
        required
    >

    <label>Birth City</label>
    <input
        id="city"
        placeholder="Chicago, IL"
        required
    >

    <button
        id="generate"
        type="submit"
    >
        Generate Chart
    </button>

</form>

<div id="status">
    Waiting...
</div>
