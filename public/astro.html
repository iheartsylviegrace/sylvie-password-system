<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Looking Glass • Astrocartography</title>

<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.28.0/mapbox-gl.css">
<link rel="stylesheet" href="styles.css">

<script src="https://api.mapbox.com/mapbox-gl-js/v3.28.0/mapbox-gl.js"></script>

</head>

<body>

<div id="app">

    <aside id="sidebar">

        <h1>The Looking Glass</h1>

        <p class="subtitle">
            Astrocartography
        </p>

        <form id="birth-data-form">

            <label>Name</label>
            <input
                id="name"
                autocomplete="name"
            >

            <label>Date of Birth</label>
            <input
                id="date"
                type="date"
                required
            >

            <label>Time of Birth</label>
            <input
                id="time"
                type="time"
                required
            >

            <label>Birth City</label>
            <input
                id="city"
                placeholder="Chicago, IL"
                required
            >

            <button
                id="generate"
                type="submit"
            >
                Generate Chart
            </button>

        </form>

        <div id="status">
            Waiting…
        </div>

    </aside>

    <main id="map"></main>

</div>

<script src="map.js"></script>
<script src="lines.js"></script>
<script src="astro.js"></script>

</body>
</html>
